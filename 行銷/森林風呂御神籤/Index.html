<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>森林風呂御神籤</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@500;700;900&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #f6f0e4;
    --paper-2: #efe6d3;
    --ink: #2b2a26;
    --ink-2: #6b6558;
    --forest: #2f5d46;
    --forest-2: #e3ecdf;
    --torii: #b8402f;
    --torii-2: #f3ddd6;
    --wood: #b98a57;
    --wood-2: #8a6239;
    --line: #d9cdb4;
    --card: #fffdf7;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--paper);
    background-image:
      radial-gradient(circle at 20% 10%, rgba(47,93,70,.07) 0, transparent 40%),
      radial-gradient(circle at 90% 90%, rgba(184,64,47,.06) 0, transparent 40%);
    color: var(--ink);
    font-family: "Noto Sans TC", system-ui, sans-serif;
    font-size: 18px;
    line-height: 1.6;
    min-height: 100vh;
  }
  .wrap { max-width: 480px; margin: 0 auto; padding: 20px 16px 40px; min-height: 100vh; display: flex; flex-direction: column; }
  .serif { font-family: "Noto Serif TC", serif; }
  h1 { font-family: "Noto Serif TC", serif; font-weight: 900; font-size: 34px; letter-spacing: .12em; margin: 8px 0 4px; text-align: center; color: var(--forest); }
  .sub { text-align: center; color: var(--ink-2); margin: 0 0 8px; }
  .screen { display: none; flex: 1; flex-direction: column; }
  .screen.on { display: flex; animation: fade .35s ease; }
  @keyframes fade { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }

  /* 籤筒 */
  .tube-box { display: flex; justify-content: center; margin: 12px 0 8px; }
  .tube { width: 180px; height: 230px; transform-origin: 50% 90%; }
  .tube.shake { animation: shake .9s ease-in-out; }
  @keyframes shake {
    0%,100% { transform: rotate(0); }
    15% { transform: rotate(-14deg); } 30% { transform: rotate(12deg); }
    45% { transform: rotate(-10deg); } 60% { transform: rotate(8deg); }
    75% { transform: rotate(-4deg); }
  }
  .tube .pop { transition: transform .5s cubic-bezier(.2,1.6,.4,1); }
  .tube.popped .pop { transform: translateY(-46px); }

  .gift { background: var(--card); border: 1.5px dashed var(--torii); border-radius: 14px; padding: 12px 14px; text-align: center; margin: 8px 0 20px; }
  .gift b { color: var(--torii); font-size: 22px; }
  .btn {
    display: block; width: 100%; border: 0; border-radius: 14px; padding: 16px;
    font: 700 21px "Noto Sans TC", sans-serif; letter-spacing: .08em; cursor: pointer;
    background: var(--torii); color: #fff; box-shadow: 0 4px 0 #8c2e21;
  }
  .btn:active { transform: translateY(3px); box-shadow: 0 1px 0 #8c2e21; }
  .btn:disabled { opacity: .5; }
  .btn.ghost { background: transparent; color: var(--ink-2); box-shadow: none; font-weight: 500; font-size: 17px; }
  .note { color: var(--ink-2); font-size: 15px; text-align: center; margin-top: 14px; }

  /* 進度:8 支籤 */
  .sticks { display: flex; justify-content: center; gap: 7px; margin: 4px 0 16px; }
  .sticks i { width: 10px; height: 34px; border-radius: 3px 3px 5px 5px; background: var(--line); transition: background .3s, transform .3s; }
  .sticks i.done { background: var(--wood); }
  .sticks i.now { background: var(--torii); transform: translateY(-6px); }

  .qcard { background: var(--card); border: 1px solid var(--line); border-radius: 18px; padding: 20px 18px 18px; box-shadow: 0 6px 20px rgba(80,60,30,.08); position: relative; }
  .qno { position: absolute; top: -16px; left: 50%; transform: translateX(-50%); background: var(--forest); color: #fff; font-family: "Noto Serif TC", serif; font-weight: 700; padding: 3px 18px; border-radius: 999px; font-size: 16px; letter-spacing: .15em; white-space: nowrap; }
  .qtag { text-align: center; color: var(--forest); font-size: 14px; margin-top: 6px; }
  .qtext { font-family: "Noto Serif TC", serif; font-weight: 700; font-size: 23px; line-height: 1.5; text-align: center; margin: 6px 0 18px; }
  .opts { display: flex; flex-direction: column; gap: 10px; }
  .opt {
    display: flex; align-items: center; gap: 14px; width: 100%; text-align: left;
    background: #fff; border: 1.5px solid var(--line); border-radius: 12px; padding: 12px 14px;
    font: 500 19px "Noto Sans TC", sans-serif; color: var(--ink); cursor: pointer;
  }
  .opt .em { font-size: 28px; width: 34px; text-align: center; line-height: 1; }
  .opt.sel { border-color: var(--forest); background: var(--forest-2); }
  .opt.soft { color: var(--ink-2); font-size: 17px; border-style: dashed; }
  .grp-label { font-weight: 700; margin: 4px 0 8px; color: var(--forest); }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 16px; }
  .chip { border: 1.5px solid var(--line); background: #fff; border-radius: 999px; padding: 8px 14px; font: 500 17px "Noto Sans TC", sans-serif; color: var(--ink); cursor: pointer; }
  .chip.sel { border-color: var(--forest); background: var(--forest-2); }
  .back { margin-top: 14px; }

  textarea { width: 100%; min-height: 110px; border: 1.5px solid var(--line); border-radius: 12px; padding: 12px; font: 18px "Noto Sans TC", sans-serif; background: #fff; color: var(--ink); resize: vertical; }

  /* 籤詩 */
  .omikuji {
    background: #fffdf5; border: 2px solid var(--torii); border-radius: 6px; padding: 22px 18px 18px;
    position: relative; text-align: center; box-shadow: 0 8px 24px rgba(120,40,20,.12);
  }
  .omikuji::before { content: ""; position: absolute; inset: 6px; border: 1px solid var(--torii-2); border-radius: 3px; pointer-events: none; }
  .luck { font-family: "Noto Serif TC", serif; font-weight: 900; font-size: 56px; color: var(--torii); letter-spacing: .2em; line-height: 1.1; margin: 4px 0 10px; }
  .poem { font-family: "Noto Serif TC", serif; font-size: 20px; line-height: 1.8; margin-bottom: 14px; }
  .coupon { background: var(--torii-2); border-radius: 10px; padding: 12px; margin: 10px 0 4px; }
  .coupon .t { font-weight: 700; font-size: 19px; }
  .coupon .no { font-family: "Noto Serif TC", serif; font-weight: 900; font-size: 30px; color: var(--torii); letter-spacing: .08em; }
  .live { display: flex; align-items: center; justify-content: center; gap: 8px; font-size: 16px; color: var(--ink-2); margin-top: 8px; }
  .dot { width: 10px; height: 10px; border-radius: 50%; background: #3aa35b; animation: blink 1s infinite; }
  @keyframes blink { 50% { opacity: .2; } }
  .show { margin-top: 16px; background: var(--forest); color: #fff; border-radius: 12px; padding: 12px; text-align: center; font-weight: 700; }
  .rules { font-size: 14px; color: var(--ink-2); margin-top: 14px; line-height: 1.7; }
  .again { text-align: center; color: var(--forest); font-weight: 700; margin-bottom: 10px; }
  .foot { text-align: center; font-size: 13px; color: var(--ink-2); margin-top: auto; padding-top: 20px; }
  .credit { font-size: 11px; opacity: .75; margin-top: 4px; }
  .credit a { color: inherit; text-decoration: none; }
</style>
</head>

    <button class="btn" id="btn-submit">看我的籤詩 🎋</button>

      <div class="coupon">

        <div class="no" id="cno"></div>
      </div>

    <div class="show">請把這個畫面給風呂櫃台看<br>領取紙本咖啡券 ☕</div>
    <div class="rules">

      ・每人每天限領 1 次・不得兌換現金、不找零

  <div class="foot">礁溪溫泉公園・森林風呂 × 時間到咖啡館
    <div class="credit">問卷設計 Eileen ・ <a href="tel:0975328779">0975-328-779</a></div>
  </div>
</div>

  function shuffle(a) { a = a.slice(); for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)); var t = a[i]; a[i] = a[j]; a[j] = t; } return a; }
  function pick(a, n) { return shuffle(a).slice(0, n); }
  function today() { var d = new Date(); return d.getFullYear() + "-" + ("0" + (d.getMonth() + 1)).slice(-2) + "-" + ("0" + d.getDate()).slice(-2); }
  var KEY = "fr-omikuji-" + today();
  function load() { try { var s = localStorage.getItem(KEY); return s ? JSON.parse(s) : null; } catch (e) { return null; } }
  function save(o) { try { localStorage.setItem(KEY, JSON.stringify(o)); } catch (e) {} }
  function show(id) { var s = document.querySelectorAll(".screen"); for (var i = 0; i < s.length; i++) s[i].classList.remove("on"); $(id).classList.add("on"); window.scrollTo(0, 0); }

  // ===== 狀態 =====
  var questions = [];   // 本次 10 題(第 1 題整體滿意、第 10 題基本資料卡)
  var answers = {};     // id -> 答案
  var idx = 0;

  function buildSet() {
    // 第 1 題整體滿意;中間 8 題打散:固定 3(水質、清潔、客源地)+ 環境服務 2 + 宜蘭好在地 1 + 旅遊行為 1 + 趣味 1;最後基本資料卡
    var mid = shuffle(CORE.concat(pick(POOL_SAT, 2), pick(POOL_LOCAL, 1), pick(POOL_TRAVEL, 1), pick(POOL_FUN, 1)));
    return [OVERALL].concat(mid, [{ id: "basic", tag: "🎒 認識你一下", basic: true }]);
  }

  function renderSticks(el, cur) {
    var h = "";
    for (var i = 0; i < TOTAL; i++) h += '<i class="' + (i < cur ? "done" : i === cur ? "now" : "") + '"></i>';
    el.innerHTML = h;
  }

  function renderQ() {
    var q = questions[idx];
    renderSticks($("sticks"), idx);
    $("qno").textContent = "第" + NUM[idx] + "籤";
    $("qtag").textContent = q.tag;
    $("btn-back").style.visibility = idx === 0 ? "hidden" : "visible";
    var body = $("qbody");

    if (q.basic) {
      var h = '<div class="qtext">最後一籤!你是…</div>';
      h += '<div class="grp-label">年齡</div><div class="chips" data-k="age">';
      AGES.forEach(function (a) { h += '<button class="chip' + (answers.age === a ? " sel" : "") + '" data-v="' + a + '">' + a + "</button>"; });
      h += '</div><div class="grp-label">多久來泡一次?</div><div class="chips" data-k="freq">';
      FREQS.forEach(function (a) { h += '<button class="chip' + (answers.freq === a ? " sel" : "") + '" data-v="' + a + '">' + a + "</button>"; });
      h += "</div>";
      body.innerHTML = h;
      var groups = body.querySelectorAll(".chips");
      Array.prototype.forEach.call(groups, function (g) {
        g.addEventListener("click", function (e) {
          var b = e.target.closest(".chip"); if (!b) return;
          answers[g.getAttribute("data-k")] = b.getAttribute("data-v");
          Array.prototype.forEach.call(g.children, function (c) { c.classList.toggle("sel", c === b); });
          if (answers.age && answers.freq) setTimeout(next, 280);
        });
      });
      return;
    }

    var opts = (q.opts || SCALE).slice();
    var h2 = '<div class="qtext">' + q.t + '</div><div class="opts">';
    opts.forEach(function (o) {
      h2 += '<button class="opt' + (answers[q.id] === o.v ? " sel" : "") + '" data-v="' + o.v + '"><span class="em">' + o.em + "</span>" + o.v + "</button>";
    });
    if (q.extra) h2 += '<button class="opt soft' + (answers[q.id] === q.extra ? " sel" : "") + '" data-v="' + q.extra + '"><span class="em">🤷</span>' + q.extra + "</button>";
    h2 += "</div>";
    body.innerHTML = h2;
    body.querySelector(".opts").addEventListener("click", function (e) {
      var b = e.target.closest(".opt"); if (!b) return;
      answers[q.id] = b.getAttribute("data-v");
      Array.prototype.forEach.call(this.children, function (c) { c.classList.toggle("sel", c === b); });
      setTimeout(next, 280);
    });
  }

  function next() {
    if (idx < questions.length - 1) { idx++; renderQ(); window.scrollTo(0, 0); }
    else { renderSticks($("sticks2"), TOTAL); show("s-msg"); }
  }

  // ===== 結果 =====
  var clockTimer = null;
  function showResult(r, repeat) {
    $("luck").textContent = r.luck;
    $("poem").innerHTML = r.poem;
    $("cno").textContent = "No." + r.coupon;
    $("again").hidden = !repeat;
    show("s-result");
    function tick() {
      var d = new Date();
      $("clock").textContent = today() + " " + d.toLocaleTimeString("zh-TW", { hour12: false });
    }
    tick();
    if (clockTimer) clearInterval(clockTimer);
    clockTimer = setInterval(tick, 1000);
  }

  function submit() {
    var btn = $("btn-submit");
    btn.disabled = true; btn.textContent = "抽籤中…";
    var f = FORTUNES[Math.floor(Math.random() * FORTUNES.length)];
    var payload = {
      answers: answers,
      asked: questions.map(function (q) { return q.id; }).join(","),
      message: $("msg").value.trim(),
      luck: f.l
    };
    function done(coupon) {
      var r = { luck: f.l, poem: f.p, coupon: coupon };
      save(r);
      showResult(r, false);
    }
    function fail() {
      btn.disabled = false; btn.textContent = "看我的籤詩 🎋";
      alert("網路好像不太穩,請再按一次 🙏");
    }
    if (window.google && google.script && google.script.run) {
      google.script.run.withSuccessHandler(done).withFailureHandler(fail).submit(payload);
    } else {
      // 預覽模式(不是從 Apps Script 開啟):不存資料,券號顯示 DEMO
      setTimeout(function () { done("DEMO-" + ("000" + Math.floor(Math.random() * 1000)).slice(-4)); }, 600);
    }
  }

  // ===== 事件 =====
  $("btn-draw").addEventListener("click", function () {
    var t = $("tube"), b = this;
    b.disabled = true;
    t.classList.remove("shake", "popped"); void t.offsetWidth;
    t.classList.add("shake");
    setTimeout(function () { t.classList.add("popped"); }, 850);
    setTimeout(function () {
      questions = buildSet(); answers = {}; idx = 0;
      renderQ(); show("s-q"); b.disabled = false;
      t.classList.remove("shake", "popped");
    }, 1500);
  });
  $("btn-back").addEventListener("click", function () { if (idx > 0) { idx--; renderQ(); } });
  $("btn-back2").addEventListener("click", function () { idx = questions.length - 1; renderQ(); show("s-q"); });
  $("btn-submit").addEventListener("click", submit);

  // 今天已抽過 → 直接顯示同一張籤(同一支手機每天限領一次)
  var prev = load();
  if (prev) showResult(prev, true);
})();
</script>
</body>
</html>
