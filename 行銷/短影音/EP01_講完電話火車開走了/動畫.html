<!doctype html>
<html><head><meta charset="utf-8">
<style>
  html,body{margin:0;padding:0;background:#f6efe3;}
  body{width:1080px;height:1920px;overflow:hidden;font-family:"WenQuanYi Zen Hei",sans-serif;}
  svg{display:block}
  .sub{position:absolute;left:90px;right:90px;top:1430px;text-align:center;}
  .sub span{display:inline-block;background:rgba(58,36,26,.88);color:#fff;font-size:54px;line-height:1.35;padding:18px 34px;border-radius:24px;}
  .tag{position:absolute;left:0;right:0;top:170px;text-align:center;font-size:40px;color:#7a5640;letter-spacing:6px}
</style></head>
<body>
<svg id="s" width="1080" height="1920" viewBox="0 0 1080 1920" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <g id="person">
      <!-- legs -->
      <rect x="-48" y="-170" width="30" height="170" rx="12" fill="#3a2a22"/>
      <rect x="18" y="-170" width="30" height="170" rx="12" fill="#3a2a22"/>
      <ellipse cx="-36" cy="0" rx="34" ry="14" fill="#2a1d17"/>
      <ellipse cx="36" cy="0" rx="34" ry="14" fill="#2a1d17"/>
      <!-- coat -->
      <path d="M-70,-470 Q0,-500 70,-470 L110,-150 Q0,-125 -110,-150 Z" fill="#e07a3f"/>
      <path d="M0,-485 L0,-140" stroke="#c4622b" stroke-width="6"/>
      <circle cx="-14" cy="-380" r="8" fill="#c4622b"/><circle cx="-14" cy="-300" r="8" fill="#c4622b"/><circle cx="-14" cy="-220" r="8" fill="#c4622b"/>
      <!-- bag -->
      <path d="M-70,-440 L95,-220" stroke="#5a3b2a" stroke-width="10"/>
      <rect x="70" y="-250" width="80" height="70" rx="14" fill="#5a3b2a"/>
      <!-- left arm down -->
      <rect x="-108" y="-455" width="34" height="230" rx="17" fill="#e07a3f" transform="rotate(8 -91 -455)"/>
      <!-- neck/head -->
      <rect x="-18" y="-520" width="36" height="40" fill="#f2c9a5"/>
      <circle cx="0" cy="-600" r="95" fill="#f2c9a5"/>
      <!-- hair -->
      <path d="M-98,-600 Q-100,-715 0,-712 Q100,-715 98,-600 Q80,-660 0,-668 Q-80,-660 -98,-600 Z" fill="#3b2418"/>
      <circle cx="0" cy="-725" r="42" fill="#3b2418"/>
      <!-- cheeks -->
      <circle cx="-55" cy="-570" r="16" fill="#f0a58a" opacity=".7"/>
      <circle cx="55" cy="-570" r="16" fill="#f0a58a" opacity=".7"/>
      <!-- eyes -->
      <g id="eyes"><circle cx="-34" cy="-605" r="10" fill="#2a1d17"/><circle cx="34" cy="-605" r="10" fill="#2a1d17"/></g>
    </g>
  </defs>

  <!-- ===== scene backgrounds ===== -->
  <g id="bgStation">
    <rect width="1080" height="1920" fill="#f6efe3"/>
    <!-- station roof -->
    <rect x="0" y="230" width="1080" height="60" fill="#5a3b2a"/>
    <rect x="80" y="290" width="22" height="880" fill="#7a5640"/>
    <rect x="978" y="290" width="22" height="880" fill="#7a5640"/>
    <!-- station sign -->
    <g transform="translate(540,380)">
      <rect x="-210" y="-55" width="420" height="110" rx="14" fill="#fff" stroke="#5a3b2a" stroke-width="6"/>
      <text x="0" y="18" text-anchor="middle" font-size="54" fill="#5a3b2a">第 2 月台</text>
    </g>
    <!-- track -->
    <rect x="0" y="1080" width="1080" height="40" fill="#8c8c8c"/>
    <rect x="0" y="1120" width="1080" height="16" fill="#555"/>
    <!-- platform -->
    <rect x="0" y="1136" width="1080" height="700" fill="#d9c8b0"/>
    <rect x="0" y="1136" width="1080" height="22" fill="#f2d14b"/>
  </g>

  <!-- train -->
  <g id="train">
    <rect x="0" y="640" width="1700" height="440" rx="40" fill="#3f7a6b"/>
    <rect x="0" y="990" width="1700" height="40" fill="#2e5c50"/>
    <g fill="#d8efe9">
      <rect x="60" y="720" width="200" height="150" rx="18"/>
      <rect x="320" y="720" width="200" height="150" rx="18"/>
      <rect x="640" y="700" width="160" height="290" rx="10" fill="#bfe0d7"/>
      <rect x="880" y="720" width="200" height="150" rx="18"/>
      <rect x="1140" y="720" width="200" height="150" rx="18"/>
      <rect x="1400" y="720" width="200" height="150" rx="18"/>
    </g>
    <circle cx="200" cy="1080" r="34" fill="#333"/><circle cx="500" cy="1080" r="34" fill="#333"/>
    <circle cx="1200" cy="1080" r="34" fill="#333"/><circle cx="1500" cy="1080" r="34" fill="#333"/>
  </g>
  <g id="speed" stroke="#7a5640" stroke-width="10" stroke-linecap="round" opacity="0">
    <line x1="700" y1="720" x2="900" y2="720"/><line x1="760" y1="840" x2="1000" y2="840"/><line x1="720" y1="960" x2="880" y2="960"/>
  </g>

  <!-- clock (scene 3) -->
  <g id="clock" transform="translate(880,560)" opacity="0">
    <circle r="90" fill="#fff" stroke="#5a3b2a" stroke-width="10"/>
    <line id="hMin" x1="0" y1="0" x2="0" y2="-70" stroke="#5a3b2a" stroke-width="8" stroke-linecap="round"/>
    <line id="hHour" x1="0" y1="0" x2="0" y2="-45" stroke="#e07a3f" stroke-width="10" stroke-linecap="round"/>
    <circle r="10" fill="#5a3b2a"/>
  </g>

  <!-- person -->
  <g id="who" transform="translate(540,1300)">
    <use href="#person"/>
    <!-- mouth -->
    <path id="mouth" d="M-22,-545 Q0,-528 22,-545" stroke="#7a3a2a" stroke-width="7" fill="none" stroke-linecap="round"/>
    <!-- right arm + phone (rotated up to ear) -->
    <g id="arm">
      <rect x="74" y="-455" width="34" height="230" rx="17" fill="#e07a3f"/>
      <rect x="66" y="-250" width="48" height="84" rx="10" fill="#2a2a2a"/>
    </g>
    <g id="ring" opacity="0" stroke="#e07a3f" stroke-width="8" fill="none" stroke-linecap="round">
      <path d="M150,-640 q20,30 0,60"/><path d="M178,-660 q32,50 0,100"/>
    </g>
  </g>

  <!-- speech bubbles scene 3 -->
  <g id="bubbles" font-size="44" fill="#3a2a22">
    <g id="b1" opacity="0" transform="translate(250,560)"><rect x="-200" y="-60" width="400" height="110" rx="55" fill="#fff" stroke="#5a3b2a" stroke-width="5"/><text y="12" text-anchor="middle">豆子明天到?</text></g>
    <g id="b2" opacity="0" transform="translate(800,800)"><rect x="-210" y="-60" width="420" height="110" rx="55" fill="#fff" stroke="#5a3b2a" stroke-width="5"/><text y="12" text-anchor="middle">訂單再加兩箱</text></g>
    <g id="b3" opacity="0" transform="translate(280,980)"><rect x="-200" y="-60" width="400" height="110" rx="55" fill="#fff" stroke="#5a3b2a" stroke-width="5"/><text y="12" text-anchor="middle">活動海報…</text></g>
    <g id="b4" opacity="0" transform="translate(820,1000)"><rect x="-130" y="-60" width="260" height="110" rx="55" fill="#fff" stroke="#5a3b2a" stroke-width="5"/><text y="12" text-anchor="middle">對對對</text></g>
  </g>
  <!-- huh bubble scene 4 -->
  <g id="huh" opacity="0" transform="translate(760,560)">
    <ellipse rx="150" ry="100" fill="#fff" stroke="#5a3b2a" stroke-width="6"/>
    <path d="M-60,80 L-110,150 L-10,95 Z" fill="#fff" stroke="#5a3b2a" stroke-width="6" stroke-linejoin="round"/>
    <rect x="-70" y="78" width="70" height="20" fill="#fff"/>
    <text y="28" text-anchor="middle" font-size="84" fill="#3a2a22">欸?</text>
  </g>
  <g id="dots" opacity="0" fill="#5a3b2a"><circle cx="460" cy="540" r="12"/><circle cx="540" cy="540" r="12"/><circle cx="620" cy="540" r="12"/></g>

  <!-- ===== scene 5: booking phone ===== -->
  <g id="sc5" opacity="0">
    <rect width="1080" height="1920" fill="#efe3d0"/>
    <g transform="translate(540,880)">
      <rect x="-280" y="-520" width="560" height="1040" rx="60" fill="#2a2a2a"/>
      <rect x="-250" y="-470" width="500" height="940" rx="30" fill="#fff"/>
      <text y="-370" text-anchor="middle" font-size="50" fill="#3a2a22">線上訂票</text>
      <line x1="-200" y1="-330" x2="200" y2="-330" stroke="#ddd" stroke-width="4"/>
      <text x="-200" y="-250" font-size="38" fill="#7a5640">車次</text>
      <text x="200" y="-250" text-anchor="end" font-size="38" fill="#3a2a22">下一班</text>
      <text x="-200" y="-170" font-size="38" fill="#7a5640">張數</text>
      <text x="200" y="-170" text-anchor="end" font-size="38" fill="#3a2a22">1</text>
      <g id="btn"><rect x="-200" y="-80" width="400" height="110" rx="55" fill="#e07a3f"/><text y="-10" text-anchor="middle" font-size="44" fill="#fff">確認訂票</text></g>
      <g id="stamp" opacity="0" transform="translate(0,240) rotate(-10)">
        <rect x="-190" y="-80" width="380" height="160" rx="20" fill="none" stroke="#3f7a6b" stroke-width="12"/>
        <text y="28" text-anchor="middle" font-size="72" fill="#3f7a6b">再一張 ✓</text>
      </g>
      <circle id="finger" cx="120" cy="-10" r="50" fill="#f2c9a5" opacity="0" stroke="#d9a982" stroke-width="5"/>
    </g>
  </g>

  <!-- ===== scene 6: ending ===== -->
  <g id="sc6" opacity="0">
    <rect width="1080" height="1920" fill="#5a3b2a"/>
    <!-- compass spinning -->
    <g transform="translate(300,560)">
      <circle r="120" fill="#f6efe3" stroke="#e07a3f" stroke-width="10"/>
      <g id="needle"><path d="M0,-95 L22,0 L0,95 L-22,0 Z" fill="#c4622b"/><path d="M0,0 L22,0 L0,95 L-22,0 Z" fill="#7a5640"/></g>
      <text y="190" text-anchor="middle" font-size="40" fill="#f6efe3">方向感:迷路中</text>
    </g>
    <!-- coffee cup -->
    <g transform="translate(780,600)">
      <g id="steam" stroke="#f6efe3" stroke-width="10" fill="none" stroke-linecap="round" opacity=".8">
        <path d="M-40,-120 q-25,-40 0,-80 q25,-40 0,-80"/><path d="M20,-120 q-25,-40 0,-80 q25,-40 0,-80"/>
      </g>
      <path d="M-110,-90 L110,-90 L90,90 Q0,115 -90,90 Z" fill="#f6efe3"/>
      <path d="M110,-50 q70,0 60,60 q-10,45 -75,40" stroke="#f6efe3" stroke-width="22" fill="none"/>
      <ellipse cx="0" cy="-90" rx="110" ry="22" fill="#8a5a3c"/>
      <text y="190" text-anchor="middle" font-size="40" fill="#f6efe3">咖啡:很清楚</text>
    </g>
    <text x="540" y="1000" text-anchor="middle" font-size="92" fill="#fff">時間到咖啡館</text>
    <text x="540" y="1090" text-anchor="middle" font-size="44" fill="#f2c9a5">迷糊老闆娘的日常|EP.1</text>
    <text x="540" y="1200" text-anchor="middle" font-size="44" fill="#e9b48a">IG @5wudou</text>
  </g>

  <!-- ===== scene 1: title (on top) ===== -->
  <g id="sc1">
    <rect width="1080" height="1920" fill="#e07a3f"/>
    <g id="t1g" transform="translate(540,820)">
      <text y="0" text-anchor="middle" font-size="64" fill="#fff4e6">老闆娘迷糊日記</text>
      <text y="150" text-anchor="middle" font-size="120" fill="#fff">EP.1</text>
      <text y="290" text-anchor="middle" font-size="76" fill="#3a2a22">講完電話</text>
      <text y="390" text-anchor="middle" font-size="76" fill="#3a2a22">火車開走了</text>
    </g>
    <text x="540" y="1680" text-anchor="middle" font-size="40" fill="#fff4e6">時間到咖啡館</text>
  </g>
</svg>
<div class="tag" id="tag"></div>
<div class="sub" id="sub"><span id="subt"></span></div>

<script>
const $ = id => document.getElementById(id);
const clamp = (x,a=0,b=1)=>Math.max(a,Math.min(b,x));
const ease = x => { x=clamp(x); return x<.5?2*x*x:1-Math.pow(-2*x+2,2)/2; };
const fade = (t,a,b,d=.35) => clamp(Math.min((t-a)/d,(b-t)/d)); // in at a, out at b
const pop = (t,a) => { const x=clamp((t-a)/.25); return x===0?0:1+0.15*Math.sin(x*Math.PI); };

// timeline (seconds) — matched to narration clips
const SUBS = [
  [0.4, 3.6, "老闆娘迷糊日記,第一集"],
  [4.0, 7.4, "那天在月台等火車,電話響了"],
  [8.0, 12.8, "豆子、訂單、明天的活動<br>一講就停不下來"],
  [14.2, 17.6, "等我掛上電話,火車已經開走了"],
  [18.4, 21.2, "沒關係,再訂一張票就好"],
  [22.3, 26.2, "方向感不太好沒關係<br>咖啡的方向,我很清楚"],
  [26.2, 30.6, "時間到咖啡館,明天見"],
];

window.render = function(t){
  // title
  $('sc1').setAttribute('opacity', 1-clamp((t-3.5)/.35));
  $('t1g').setAttribute('transform', `translate(540,${820+40*(1-ease(t/0.8))}) scale(${0.9+0.1*ease(t/0.8)})`);
  $('t1g').style.transformOrigin='0 0';

  // train position: arrives 8.6→10.0, sits, leaves 12.9→14.0
  let tx = 1100; // off right
  if (t>=8.6 && t<10.0) tx = 1100 - (1100+200)*ease((t-8.6)/1.4);
  else if (t>=10.0 && t<12.9) tx = -200;
  else if (t>=12.9) tx = -200 - 2200*Math.pow(clamp((t-12.9)/1.1),2);
  if (t<8.6) tx=1100;
  $('train').setAttribute('transform', `translate(${tx},0)`);
  $('speed').setAttribute('opacity', (t>13.0&&t<14.4)?1:0);
  $('speed').setAttribute('transform', `translate(${-300*clamp((t-13)/1.4)},0)`);

  // phone: ringing 6.2–7.8 (in bag area / hand), raised to ear from 7.6
  const raise = ease((t-7.5)/0.5);
  const lower = ease((t-13.6)/0.4);
  const ang = -150*raise*(1-lower);
  $('arm').setAttribute('transform', `rotate(${ang} 91 -445)`);
  const ringing = t>6.2 && t<7.8;
  $('ring').setAttribute('opacity', ringing ? (Math.floor(t*8)%2?1:0.3) : 0);
  $('ring').setAttribute('transform', ringing ? `translate(${Math.sin(t*60)*4},0)` : '');

  // body bob / talk
  const talking = t>7.9 && t<13.5;
  const bob = talking ? Math.sin(t*9)*6 : 0;
  let wx = 540;
  $('who').setAttribute('transform', `translate(${wx},${1300+bob})`);
  // mouth
  let m = "M-22,-545 Q0,-528 22,-545";
  if (talking) m = (Math.floor(t*7)%2) ? "M-22,-548 Q0,-515 22,-548 Q0,-540 -22,-548 Z" : "M-18,-542 Q0,-532 18,-542";
  if (t>=13.8 && t<18) m = "M-14,-540 a14,14 0 1,0 28,0 a14,14 0 1,0 -28,0";
  $('mouth').setAttribute('d', m);
  $('mouth').setAttribute('fill', (talking||t>=13.8)?'#7a3a2a':'none');

  // clock spin during talk
  $('clock').setAttribute('opacity', fade(t,8.0,13.6));
  const spin = clamp((t-8.0)/5.6)*720;
  $('hMin').setAttribute('transform', `rotate(${spin})`);
  $('hHour').setAttribute('transform', `rotate(${spin/12+40})`);

  // bubbles
  [['b1',8.3],['b4',9.4],['b2',10.4],['b3',11.6]].forEach(([id,a])=>{
    const o = t>=a && t<13.4 ? 1:0;
    const s = pop(t,a);
    const g=$(id); g.setAttribute('opacity',o);
    const tr=g.getAttribute('data-tr')||g.getAttribute('transform'); g.setAttribute('data-tr',tr);
    g.setAttribute('transform', tr+` scale(${s||1})`);
  });

  // huh
  $('dots').setAttribute('opacity', (t>14.0&&t<15.3)?1:0);
  $('huh').setAttribute('opacity', t>=15.3 && t<17.9 ? 1:0);
  if(t>=15.3) $('huh').setAttribute('transform', `translate(760,560) scale(${pop(t,15.3)||1})`);

  // scene 5
  $('sc5').setAttribute('opacity', fade(t,17.9,21.8,.3));
  const f = $('finger');
  f.setAttribute('opacity', (t>18.9&&t<19.9)?.95:0);
  f.setAttribute('cy', -10 + 120*(1-ease((t-18.9)/.5)));
  $('btn').setAttribute('transform', (t>19.4&&t<19.7)?'translate(0,6) ':'');
  $('stamp').setAttribute('opacity', t>19.8?1:0);
  if (t>19.8) $('stamp').setAttribute('transform', `translate(0,240) rotate(-10) scale(${1+1.2*(1-ease((t-19.8)/.25))})`);

  // scene 6
  $('sc6').setAttribute('opacity', clamp((t-21.8)/.4));
  $('needle').setAttribute('transform', `rotate(${(t-21.8)*260 + Math.sin(t*3)*40})`);
  $('steam').setAttribute('transform', `translate(0,${-((t*40)%30)})`);

  // subtitles
  const cur = SUBS.find(([a,b])=>t>=a&&t<b);
  $('sub').style.opacity = cur ? 1 : 0;
  $('subt').innerHTML = cur ? cur[2] : '';
  $('tag').textContent = (t>3.8 && t<21.8) ? '#迷糊老闆娘的日常' : '';
};
render(0);
</script>
</body></html>
