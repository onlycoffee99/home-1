<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!-- 雲端容器沒有微軟標楷體:把「標楷體/DFKai-SB」對應到 AR PL UKai TW,讓 soffice 轉出的預覽 PDF 也是楷書 -->
<fontconfig>
  <alias binding="same"><family>標楷體</family><prefer><family>AR PL UKai TW</family></prefer></alias>
  <alias binding="same"><family>DFKai-SB</family><prefer><family>AR PL UKai TW</family></prefer></alias>
  <alias binding="same"><family>BiauKai</family><prefer><family>AR PL UKai TW</family></prefer></alias>
</fontconfig>
