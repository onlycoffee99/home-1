<text x="731" y="486.5" font-family="'Microsoft JhengHei','微軟正黑體','PMingLiU',sans-serif" font-size="11.5" fill="#333" text-anchor="start">3. 版底不低於渠岸頂,不妨礙排水及渠道維護。</text>
<text x="731" y="506.0" font-family="'Microsoft JhengHei','微軟正黑體','PMingLiU',sans-serif" font-size="11.5" fill="#333" text-anchor="start">4. 放流管介入口與版橋錯開,不設於橋下。</text>
<text x="731" y="525.5" font-family="'Microsoft JhengHei','微軟正黑體','PMingLiU',sans-serif" font-size="11.5" fill="#333" text-anchor="start">5. 每年防汛期前及颱風警報前清除橋下淤積、</text>
<text x="731" y="545.0" font-family="'Microsoft JhengHei','微軟正黑體','PMingLiU',sans-serif" font-size="11.5" fill="#333" text-anchor="start">　 漂流物;災後檢查橋面與橋臺並報府。</text>
<text x="731" y="564.5" font-family="'Microsoft JhengHei','微軟正黑體','PMingLiU',sans-serif" font-size="11.5" fill="#333" text-anchor="start">6. 維護管理由申請人負責;主管機關認有妨礙</text>
<text x="731" y="584.0" font-family="'Microsoft JhengHei','微軟正黑體','PMingLiU',sans-serif" font-size="11.5" fill="#333" text-anchor="start">　 河防或通水時,依指示改善或自費拆除。</text>
<text x="715" y="630" font-family="'Microsoft JhengHei','微軟正黑體','PMingLiU',sans-serif" font-size="10.5" fill="#555" text-anchor="start">依據:宜蘭縣政府水利事業(跨越水道)建造物申辦規定;</text>
<text x="715" y="646" font-family="'Microsoft JhengHei','微軟正黑體','PMingLiU',sans-serif" font-size="10.5" fill="#555" text-anchor="start">農業部農田水利署宜蘭管理處版橋規定(長度 6 m 以內、一處一座)。</text>
