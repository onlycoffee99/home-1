<text x="731" y="428" font-family="'Microsoft JhengHei','微軟正黑體','PMingLiU',sans-serif" font-size="11.5" fill="#333" text-anchor="start">1. 版橋長 4.9 m,在 6 m 以內,一處一座。</text>
