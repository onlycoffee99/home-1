"724.0" y="520.0" font-family="'Microsoft JhengHei','微軟正黑體','PMingLiU',sans-serif" font-size="12" fill="#333" text-anchor="start">4. 竣工後 30 日內報請管理處查驗。</text><text x="724.0" y="539.0" font-family="'Microsoft JhengHei','微軟正黑體','PMingLiU',sans-serif" font-size="12" fill="#333" text-anchor="start">5. 避開灌溉期施工；如須於灌溉期施工，</text><text x="724.0" y="558.0" font-family="'Microsoft JhengHei','微軟正黑體','PMingLiU',sans-serif" font-size="12" fill="#333" text-anchor="start">　　事先報經管理處同意。</text><text x="724.0" y="577.0" font-family="'Microsoft JhengHei','微軟正黑體','PMingLiU',sans-serif" font-size="12" fill="#333" text-anchor="start">6. 工程費用由本公司負擔。</text></svg>