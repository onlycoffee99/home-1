nchor="start">兩筆土地均為公有性質用地。依官方</text><text x="782.0" y="262.0" font-family="'Microsoft JhengHei','微軟正黑體','PMingLiU',sans-serif" font-size="10" fill="#333" text-anchor="start">應檢附文件三，需使用之土地如已依</text><text x="782.0" y="277.0" font-family="'Microsoft JhengHei','微軟正黑體','PMingLiU',sans-serif" font-size="10" fill="#333" text-anchor="start">農田水利法第23條第1項納入農田水利</text><text x="782.0" y="292.0" font-family="'Microsoft JhengHei','微軟正黑體','PMingLiU',sans-serif" font-size="10" fill="#333" text-anchor="start">事業作業基金者，得免附土地使用同意</text><text x="782.0" y="307.0" font-family="'Microsoft JhengHei','微軟正黑體','PMingLiU',sans-serif" font-size="10" fill="#333" text-anchor="start">證明；權屬請調謄本並洽羅東工作站確認。</text><rect x="766.0" y="324.0" width="332.0" height="148.0" fill="#fff8f8" stroke="#c62828" stroke-width="1.2" rx="4"/><text x="780.0" y="348.0" font-family="'Microsoft JhengHei','微軟正黑體','PMingLiU',sans-serif" font-size="12" fill="#c62828" text-anchor="start" font-weight="700">施設承諾</text><text x="782.0" y="370.0" font-family="'Microsoft JhengHei','微軟正黑體','PMingLiU',sans-serif" font-size="10" fill="#333" text-anchor="start">1. 管線施設不妨礙農路通行及渠道通水。</text><text x="782.0" y="385.0" font-family="'Microsoft JhengHei','微軟正黑體','PMingLiU',sans-serif" font-size="10" fill="#333" text-anchor="start">2. 施工前 7 日通知管理處及羅東工作站，</text><text x="782.0" y="400.0" font-family="'Microsoft JhengHei','微軟正黑體','PMingLiU',sans-serif" font-size="10" fill="#333" text-anchor="start">　　會同放樣後始得施工。</text><text x="782.0" y="415.0" font-family="'Microsoft JhengHei','微軟正黑體','PMingLiU',sans-serif" font-size="10" fill="#333" text-anchor="start">3. 路面及護岸開挖後即時復舊，</text><text x="782.0" y="430.0" font-family="'Microsoft JhengHei','微軟正黑體','PMingLiU',sans-serif" font-size="10" fill="#333" text-anchor="start">　　回復原狀。</text><text x="782.0" y="445.0" font-family="'Microsoft JhengHei','微軟正黑體','PMingLiU',sans-serif" font-size="10" fill="#333" text-anchor="start">4. 損壞農田水利設施或農路者，由本公司</text><text x="782.0" y="460.0" font-family="'Microsoft JhengHei','微軟正黑體','PMingLiU',sans-serif" font-size="10" fill="#333" text-anchor="start">　　負責無條件修復或賠償。</text><text x="782.0" y="475.0" font-family="'Microsoft JhengHei','微軟正黑體','PMingLiU',sans-serif" font-size="10" fill="#333" text-anchor="start">5. 許可期間屆滿或廢止時，自費拆除管線</text><text x="782.0" y="490.0" font-family="'Microsoft JhengHei','微軟正黑體','PMingLiU',sans-serif" font-size="10" fill="#333" text-anchor="start">　　並回復原狀。</text><rect x="766.0" y="484.0" width="332.0" height="96.0" fill="#f4f9ff" stroke="#1565c0" stroke-width="1.2" rx="4"/><text x="780.0" y="508.0" font-family="'Microsoft JhengHei','微軟正黑體','PMingLiU',sans-serif" font-size="12" fill="#0d47a1" text-anchor="start" font-weight="700">介入口坐標（TWD97）</text><text x="784.0" y="530.0" font-family="'Microsoft JhengHei','微軟正黑體','PMingLiU',sans-serif" font-size="11" fill="#123" text-anchor="start">E　325727.90</text><text x="784.0" y="548.0" font-family="'Microsoft JhengHei','微軟正黑體','PMingLiU',sans-serif" font-size="11" fill="#123" text-anchor="start">N　2726851.58</text><text x="784.0" y="566.0" font-family="'Microsoft JhengHei','微軟正黑體','PMingLiU',sans-serif" font-size="10" fill="#123" text-anchor="start">樁號：依初勘實測為準</text><text x="46.0" y="766.0" font-family="'Microsoft JhengHei','微軟正黑體','PMingLiU',sans-serif" font-size="9" fill="#666" text-anchor="start">註：本圖為官方應檢附文件「借用他人土地者，應含設置於其土地管線位置圖說」之圖說。實際借用範圍、長度及是否須另取得土地使用同意，依地籍謄本權屬及管理處初勘結果為準。</text></svg>